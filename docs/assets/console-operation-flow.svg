<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 621" width="480" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title: content center = (40 + 440) / 2 = 240 -->
  <text x="240" y="32" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">控制台操作流程（含取值）</text>

  <!-- Box 1: Login (blue, 2 lines, y=60, h=54) -->
  <rect x="40" y="60" width="400" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="82" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">登录控制台</text>
  <text x="240" y="100" font-size="12" fill="#1e40af" text-anchor="middle">用户名 admin ／ 口令见 §15.2</text>

  <!-- Arrow 1 → Box 2 (blue) -->
  <path d="M240,119 L240,131" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Box 2: ACME credential (blue, 3 lines, y=142, h=72) -->
  <rect x="40" y="142" width="400" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="164" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">创建 ACME 账号凭据（凭据页 → 新建）</text>
  <text x="240" y="182" font-size="12" fill="#1e40af" text-anchor="middle">类型 acme.account（下拉显示「ACME 账号」）</text>
  <text x="240" y="200" font-size="12" fill="#1e40af" text-anchor="middle">ca: letsencrypt-staging</text>

  <!-- Arrow 2 → Box 3 (blue) -->
  <path d="M240,219 L240,231" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Box 3: DNS credential (blue, 3 lines, y=242, h=72) -->
  <rect x="40" y="242" width="400" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="264" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">创建 DNS 提供商凭据（凭据页 → 新建）</text>
  <text x="240" y="282" font-size="12" fill="#1e40af" text-anchor="middle">类型 cloudflare（下拉显示「Cloudflare（DNS）」）</text>
  <text x="240" y="300" font-size="12" fill="#1e40af" text-anchor="middle">api_token: &lt;你的 Cloudflare Token&gt;</text>

  <!-- Arrow 3 → Box 4 (blue) -->
  <path d="M240,319 L240,331" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Box 4: Pipeline (blue, 3 lines, y=342, h=72) -->
  <rect x="40" y="342" width="400" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="364" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">新建流水线（流水线页 → 新建，3 步骤）</text>
  <text x="240" y="382" font-size="12" fill="#1e40af" text-anchor="middle">cert.apply: dns-01, account_credential_id=1, dns_credential_id=2</text>
  <text x="240" y="400" font-size="12" fill="#1e40af" text-anchor="middle">cert.store → cert.deploy(target=local, force=false)</text>

  <!-- Arrow 4 → Box 5 (orange) -->
  <path d="M240,419 L240,431" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Box 5: Run (orange, 2 lines, y=442, h=54) -->
  <rect x="40" y="442" width="400" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="464" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">立即运行（列表页点「立即运行」）</text>
  <text x="240" y="482" font-size="12" fill="#b45309" text-anchor="middle">跳转运行历史详情，每 5s 轮询：running → success</text>

  <!-- Arrow 5 → Box 6 (green) -->
  <path d="M240,501 L240,513" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Box 6: Verify (green, 3 lines, y=524, h=72) -->
  <rect x="40" y="524" width="400" height="72" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="546" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">验证证书</text>
  <text x="240" y="564" font-size="12" fill="#166534" text-anchor="middle">证书页可见；staging 的 issuer 含 (STAGING)，不受浏览器信任</text>
  <text x="240" y="582" font-size="12" fill="#166534" text-anchor="middle">data/certs/&lt;指纹&gt;/cert.pem 与 key.pem 已落盘</text>
</svg>
