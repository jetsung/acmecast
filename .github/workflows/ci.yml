name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 凭据加密密钥与 JWT 密钥仅用于 CI 内的集成测试，非生产用途。
  ACMECAST__SECURITY__CREDENTIAL_KEY: "Y2ktb25seS1rZXktZm9yLXRlc3RpbmctMzItYnl0ZXM="
  ACMECAST__SECURITY__JWT_SECRET: "ci-only-jwt-secret"

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: Clippy（拒绝任何警告）
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 前端与后端相互独立，各自成为一个 job 以便并行：前端失败不该等 Rust 编译完。
  frontend:
    name: 前端（测试 / 类型检查 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 版本与 frontend/package.json 的 `packageManager` 保持一致；这里显式写死，
      # 是因为 pnpm/action-setup 默认只在仓库根找 package.json，而根目录没有。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 跑用例（vitest + jsdom）
        run: pnpm test

      # build 里的 `tsc -b` 同时完成类型检查，不再单独跑一次 typecheck。
      - name: 类型检查与生产构建
        run: pnpm build

  # 文档站点：strict 模式下任何告警（配置错误、无效链接等）都会让构建失败，
  # 避免文档悄悄烂掉。
  docs:
    name: 文档（构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 固定版本：zensical 尚在 0.0.x，行为可能随版本变化。
      - name: 安装 zensical
        run: pip install zensical==0.0.62

      - name: 构建文档（--strict：告警即失败）
        run: zensical build --clean --strict

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建整个 workspace
        run: cargo build --workspace --all-targets

  test:
    name: 全量测试（SQLite 内存 + pebble 端到端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # JKS 的产出必须由 Java 运行时来验证，测试会主动查找 keytool 并在缺失时失败
      # （不跳过）。这里显式安装，而不是依赖 runner 镜像的预装 JDK。
      - name: 安装 JDK（提供 keytool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 运行全部测试（含 pebble 端到端与 hash-password 子命令）
        run: cargo test --workspace

  license:
    name: 依赖许可证合规
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-deny
        run: cargo install cargo-deny --locked

      - name: 校验依赖树许可证
        run: cargo deny check

  # 三方言集成测试：MySQL 与 PostgreSQL 由 service container 提供，
  # SQLite 使用临时文件。三者共用同一套测试用例以验证行为等价。
  integration-sqlite:
    name: 集成测试（SQLite）
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行集成测试（SQLite 内存，测试自行建库）
        run: cargo test --workspace

  integration-mysql:
    name: 集成测试（MySQL）
    runs-on: ubuntu-latest
    needs: [build]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: acmecast
          MYSQL_DATABASE: acmecast
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行方言等价性套件（MySQL 直连）
        env:
          ACMECAST_TEST_MYSQL_URL: "mysql://root:acmecast@127.0.0.1:3306/acmecast"
        run: cargo test -p acmecast-server --test dialect_equivalence -- mysql_

  integration-postgres:
    name: 集成测试（PostgreSQL）
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: acmecast
          POSTGRES_DB: acmecast
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行方言等价性套件（PostgreSQL 直连）
        env:
          ACMECAST_TEST_POSTGRES_URL: "postgres://postgres:acmecast@127.0.0.1:5432/acmecast"
        run: cargo test -p acmecast-server --test dialect_equivalence -- postgres_
