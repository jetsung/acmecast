name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 凭据加密密钥与 JWT 密钥仅用于 CI 内的集成测试，非生产用途。
  ACMECAST__SECURITY__CREDENTIAL_KEY: "Y2ktb25seS1rZXktZm9yLXRlc3RpbmctMzItYnl0ZXM="
  ACMECAST__SECURITY__JWT_SECRET: "ci-only-jwt-secret"

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: Clippy（拒绝任何警告）
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 构建整个 workspace
        run: cargo build --workspace --all-targets

  test:
    name: 全量测试（SQLite 内存 + pebble 端到端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # JKS 的产出必须由 Java 运行时来验证，测试会主动查找 keytool 并在缺失时失败
      # （不跳过）。这里显式安装，而不是依赖 runner 镜像的预装 JDK。
      - name: 安装 JDK（提供 keytool）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 运行全部测试（含 pebble 端到端与 hash-password 子命令）
        run: cargo test --workspace

  license:
    name: 依赖许可证合规
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-deny
        run: cargo install cargo-deny --locked

      - name: 校验依赖树许可证
        run: cargo deny check

  # 三方言集成测试：MySQL 与 PostgreSQL 由 service container 提供，
  # SQLite 使用临时文件。三者共用同一套测试用例以验证行为等价。
  integration-sqlite:
    name: 集成测试（SQLite）
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行集成测试（SQLite 内存，测试自行建库）
        run: cargo test --workspace

  integration-mysql:
    name: 集成测试（MySQL）
    runs-on: ubuntu-latest
    needs: [build]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: acmecast
          MYSQL_DATABASE: acmecast
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行方言等价性套件（MySQL 直连）
        env:
          ACMECAST_TEST_MYSQL_URL: "mysql://root:acmecast@127.0.0.1:3306/acmecast"
        run: cargo test -p acmecast-server --test dialect_equivalence -- mysql_

  integration-postgres:
    name: 集成测试（PostgreSQL）
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: acmecast
          POSTGRES_DB: acmecast
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行方言等价性套件（PostgreSQL 直连）
        env:
          ACMECAST_TEST_POSTGRES_URL: "postgres://postgres:acmecast@127.0.0.1:5432/acmecast"
        run: cargo test -p acmecast-server --test dialect_equivalence -- postgres_
