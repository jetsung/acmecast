# 提交前预处理（prek：Rust 重写的 pre-commit，原生 TOML 配置，也兼容 .pre-commit-config.yaml）。
#
# 用法（prek 由 mise.toml 的 [tools] 通过 aqua 后端安装，不需要 pip/pipx 安装）：
#   prek install                      # 按 default_install_hook_types 写入 .git/hooks/
#   prek run --all-files              # 全量跑一遍（默认只跑 pre-commit 阶段的钩子）
#   prek run cargo-clippy --all-files --stage pre-push   # 单独跑某个（含其他阶段的）钩子
#   prek uninstall                    # 移除钩子
#:schema https://www.schemastore.org/prek.json

# 与 mise.toml 中 aqua:j178/prek 提供的版本对齐，避免各人行为不一致。
minimum_prek_version = "0.5.0"

# 安装两个 hook：提交前只跑快检查，重的静态检查与测试放到推送前。
# 想改成每次提交都跑 clippy / test，把对应钩子的 stages 改掉即可。
default_install_hook_types = ["pre-commit", "pre-push"]

# 生成物与依赖目录不参与检查（.gitignore 命中的文件 prek 会跳过，这里显式兜底）。
exclude = { glob = [
    "target/**",
    "frontend/node_modules/**",
    "frontend/dist/**",
    "site/**",
] }

# 1) 文件卫生：prek 的 Rust 内置实现，离线可用、不需要额外环境。
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    # rustfmt.toml 的 newline_style = "unix"
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    # 随附的 swagger-ui 压缩包（4.2M）是有意入库的，不该被默认的大文件阈值拦下。
    { id = "check-added-large-files", exclude = { glob = "docker/*.zip" } },
]
# 刻意不含 detect-private-key：本仓库源码里到处是 "-----BEGIN PRIVATE KEY-----"
# 这类 PEM 头部字符串常量（见 crates/acmecast-cert/src/pem.rs），该钩子会全线误报。

# 2) Rust：参数与 CI 的 lint job（.github/workflows/ci.yml）逐字对齐，
#    避免本地通过、CI 失败这种分歧。language = "system" 表示直接用 devShell 里的 cargo。
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --check"
language = "system"
entry = "cargo fmt"
args = ["--all", "--", "--check"]
files = "\\.rs$"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy -D warnings"
language = "system"
entry = "cargo clippy"
args = ["--workspace", "--all-targets", "--", "-D", "warnings"]
files = "\\.rs$"
pass_filenames = false
stages = ["pre-push"]

# 测试同样放到推送前：跑一轮是分钟级，且**需要 Docker**——pipeline_e2e 会自起
# pebble 容器，dialect_equivalence 会自起 mysql / postgres 容器（起不来则跳过并说明）。
# 范围只到 acmecast-server，没有与 CI 的 `cargo test --workspace` 逐字对齐：
# acmecast-cert 的 JKS 用例要求真实的 keytool，缺了直接失败而不是跳过，而 devShell
# 里没有 JDK（CI 是单独装了 JDK 21 才跑全量）。要本地跑全量，先自行提供 keytool
# （设 ACMECAST_KEYTOOL 或自行安装 JDK），再把下面的参数换成 --workspace。
[[repos.hooks]]
id = "cargo-test"
name = "cargo test（acmecast-server）"
language = "system"
entry = "cargo test"
args = ["-p", "acmecast-server"]
files = "\\.rs$"
pass_filenames = false
stages = ["pre-push"]
