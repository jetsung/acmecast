[package]
name = "acmecast-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "DNS 挑战：提供商抽象与 ACME 挑战记录管理"

[dependencies]
acmecast-core.workspace = true
# 挑战信息与应答材料由 ACME 客户端产出，这里只负责「该投放什么」。
acmecast-acme.workspace = true
base64.workspace = true
chrono.workspace = true
# 权威 NS 直查 TXT：公共递归解析器的负缓存会毒死传播等待，只有权威侧的答案可信。
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
hmac.workspace = true
reqwest.workspace = true
sha1.workspace = true
sha2.workspace = true
uuid.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
toml = "0.8"

[dev-dependencies]
# `start_paused`：让「查询挂起」的用例在虚拟时钟下秒级完成。
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
