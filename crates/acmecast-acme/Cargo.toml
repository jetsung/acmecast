[package]
name = "acmecast-acme"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
acmecast-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rustls-pki-types = "1.15.1"
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
reqwest.workspace = true

[features]
# 开放进程内的 mock ACME 服务器与可注入的 HTTP 传输层，供**其它 crate 的测试**使用。
# 生产构建不启用，因此这些测试代码不会进二进制。
testing = []

[lints]
workspace = true

[dev-dependencies]
tokio.workspace = true
# 用于在测试中独立复算 DNS TXT 值，验证的不是「调了同一个函数」而是计算结果本身。
sha2.workspace = true
