[package]
name = "acmecast-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "通知渠道：适配器（飞书/钉钉/通用/邮件 SMTP）、事件订阅与异步投递"

[dependencies]
# 事件订阅实现 `EventSink`；事件协议（`PipelineEvent`）由引擎定义。
acmecast-pipeline.workspace = true
# 消息素材取自运行历史与流水线定义。
acmecast-store.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
# SMTP 邮件渠道的传输与消息构建（rustls 后端，见 workspace 依赖注释）。
lettre.workspace = true
reqwest.workspace = true
# 步骤输入 schema 从结构体推导（`notify.summary` 的 channels 字段）。
schemars.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
wiremock.workspace = true
# `start_paused`：退避重试的用例在虚拟时钟下秒级完成。
tokio = { workspace = true, features = ["test-util"] }
# 步骤单测要构造执行上下文：凭据存储与密钥体系来自这两个 crate。
acmecast-access.workspace = true
acmecast-core.workspace = true

[lints]
workspace = true
